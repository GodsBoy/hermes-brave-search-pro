# Example Hermes configuration for Brave Search Pro plus Hermes' bundled
# web-tavily extraction provider. TAVILY_API_KEY is optional for keyed access.
# Run `hermes plugins enable brave-search` first. Hermes manages both the
# granted_capabilities entry and matching capabilities_consent receipt.

plugins:
  enabled:
    - brave-search

web:
  search_backend: "brave-pro"
  extract_backend: "tavily"
