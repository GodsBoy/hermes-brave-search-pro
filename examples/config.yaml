# Example Hermes configuration for Brave Search Pro plus optional keyed Tavily
# extraction. Set TAVILY_API_KEY in the Hermes environment before using it.

plugins:
  enabled:
    - brave-search
  entries:
    brave-search:
      allow_tool_override: true

web:
  backend: "brave-pro"
  search_backend: "brave-pro"
  extract_backend: "tavily"
